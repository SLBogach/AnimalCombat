name: CombatLab

on:
  push:
    paths:
      - ".gitattributes"
      - "CombatLab/**"
      - "Docs/**"
      - ".github/workflows/combatlab.yml"
  pull_request:
    paths:
      - ".gitattributes"
      - "CombatLab/**"
      - "Docs/**"
      - ".github/workflows/combatlab.yml"

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.configuration }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        configuration:
          - Debug
          - Release

    defaults:
      run:
        working-directory: CombatLab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: CombatLab/global.json
          cache: true
          cache-dependency-path: CombatLab/**/packages.lock.json

      - name: Restore locked packages
        run: dotnet restore CombatLab.sln --locked-mode

      - name: Build
        run: dotnet build CombatLab.sln --configuration ${{ matrix.configuration }} --no-restore

      - name: Verify WP-06 target determinism
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./scripts/verify-wp06-target-determinism.ps1 -Configuration ${{ matrix.configuration }}

      - name: Verify WP-07 target determinism
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./scripts/verify-wp07-target-determinism.ps1 -Configuration ${{ matrix.configuration }}

      - name: Verify WP-08 target determinism
        shell: pwsh
        run: ./scripts/verify-wp08-target-determinism.ps1 -Configuration ${{ matrix.configuration }}

      - name: Verify WP-04 generated balance artifacts
        shell: pwsh
        run: ./scripts/verify-wp04-generated.ps1 -Configuration ${{ matrix.configuration }}

      - name: Test
        run: >-
          dotnet test CombatLab.sln
          --configuration ${{ matrix.configuration }}
          --no-build
          --no-restore

      - name: Enforce WP-08 blocking test inventory
        run: >-
          dotnet test CombatLab.sln
          --configuration ${{ matrix.configuration }}
          --no-build
          --no-restore
          --filter "WorkPackage=WP08"

      - name: Collect Battle.Core coverage
        if: matrix.configuration == 'Release'
        run: >-
          dotnet test tests/Battle.Core.UnitTests/Battle.Core.UnitTests.csproj
          --configuration ${{ matrix.configuration }}
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --settings coverage.runsettings
          --results-directory TestResults/Coverage/Core

      - name: Collect WP-08 replay and contract coverage
        if: matrix.configuration == 'Release'
        run: >-
          dotnet test tests/Battle.ConformanceTests/Battle.ConformanceTests.csproj
          --configuration ${{ matrix.configuration }}
          --no-build
          --no-restore
          --filter "WorkPackage=WP08"
          --collect:"XPlat Code Coverage"
          --settings coverage.wp08-replay.runsettings
          --results-directory TestResults/Coverage/WP08Replay

      - name: Enforce WP-02 branch coverage
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./scripts/verify-wp02-coverage.ps1 -ResultsDirectory ./TestResults/Coverage/Core

      - name: Enforce WP-03 branch coverage
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./scripts/verify-wp03-coverage.ps1 -ResultsDirectory ./TestResults/Coverage/Core

      - name: Enforce WP-06 branch coverage
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./scripts/verify-wp06-coverage.ps1 -ResultsDirectory ./TestResults/Coverage/Core

      - name: Enforce WP-07 coverage
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./scripts/verify-wp07-coverage.ps1 -ResultsDirectory ./TestResults/Coverage/Core

      - name: Enforce WP-08 coverage
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: >-
          ./scripts/verify-wp08-coverage.ps1
          -CoreResultsDirectory ./TestResults/Coverage/Core
          -ReplayResultsDirectory ./TestResults/Coverage/WP08Replay

      - name: Publish coverage
        if: always() && matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: combatlab-coverage-${{ matrix.os }}
          path: CombatLab/TestResults/Coverage/**/coverage.cobertura.xml
