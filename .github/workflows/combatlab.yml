name: CombatLab

on:
  push:
    paths:
      - "CombatLab/**"
      - ".github/workflows/combatlab.yml"
  pull_request:
    paths:
      - "CombatLab/**"
      - ".github/workflows/combatlab.yml"

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    defaults:
      run:
        working-directory: CombatLab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: CombatLab/global.json
          cache: true
          cache-dependency-path: CombatLab/**/packages.lock.json

      - name: Restore locked packages
        run: dotnet restore CombatLab.sln --locked-mode

      - name: Build
        run: dotnet build CombatLab.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CombatLab.sln --configuration Release --no-build --no-restore

      - name: Collect WP-02 coverage
        run: >-
          dotnet test tests/Battle.Core.UnitTests/Battle.Core.UnitTests.csproj
          --configuration Release
          --no-build
          --no-restore
          --collect:"XPlat Code Coverage"
          --settings coverage.runsettings
          --results-directory TestResults/Coverage

      - name: Enforce WP-02 branch coverage
        shell: pwsh
        run: ./scripts/verify-wp02-coverage.ps1 -ResultsDirectory ./TestResults/Coverage

      - name: Publish coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combatlab-coverage-${{ matrix.os }}
          path: CombatLab/TestResults/Coverage/**/coverage.cobertura.xml
