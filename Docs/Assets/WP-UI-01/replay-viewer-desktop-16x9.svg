    <path d="M24 24 H1576 V151 L1304 134 H296 L24 151 Z" fill="#071018" fill-opacity="0.91"/>
    <path d="M24 151 L296 134 H1304 L1576 151" fill="none" stroke="#4f727a" stroke-width="2" opacity="0.8"/>

