    <path d="M800 582 V790 M510 582 L430 790 M1090 582 L1170 790" stroke="#557078" stroke-opacity="0.25" stroke-width="2"/>
    <ellipse cx="800" cy="776" rx="660" ry="26" fill="#02070a" opacity="0.46"/>

