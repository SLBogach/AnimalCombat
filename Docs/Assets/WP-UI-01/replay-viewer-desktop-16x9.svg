    <g transform="translate(1295 329)" filter="url(#shadow)">
      <ellipse cx="32" cy="360" rx="118" ry="22" fill="#02070a" opacity="0.55"/>
      <path d="M18 107 C-2 150 5 201 38 239 L-2 329 L47 329 L76 264 L111 331 L159 331 L112 215 C126 163 105 118 73 96 Z" fill="#2b2420" stroke="#ff8b3d" stroke-width="7"/>
      <path d="M39 62 L34 0 L58 53 M71 55 L88 -4 L91 70" fill="#2b2420" stroke="#ff8b3d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="66" cy="86" rx="48" ry="51" fill="#352a24" stroke="#ff8b3d" stroke-width="7"/>
      <path d="M25 93 L-18 106 L28 117" fill="#352a24" stroke="#ff8b3d" stroke-width="7" stroke-linejoin="round"/>
      <circle cx="48" cy="77" r="6" fill="#ff8b3d"/>
      <path d="M20 158 C-25 176 -47 205 -60 238" fill="none" stroke="#ff8b3d" stroke-width="21" stroke-linecap="round"/>
      <path d="M104 199 C187 224 217 269 238 317" fill="none" stroke="#2b2420" stroke-width="29" stroke-linecap="round"/>
      <path d="M-18 336 H55 M92 336 H174" stroke="#ff8b3d" stroke-width="9" stroke-linecap="round"/>
      <path d="M-46 231 L-75 241 L-47 251" fill="#ff8b3d"/>
      <rect x="-60" y="349" width="210" height="32" rx="16" fill="#071018" stroke="#ff8b3d" stroke-width="2"/>
      <text x="45" y="371" fill="#f4f7fa" font-size="15" font-weight="800" text-anchor="middle">◀  9570 · KANGAROO</text>
    </g>

    <!-- Recorded wall impact cue -->
