<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Animal Combat Replay Viewer — game-first desktop 16:9 reference</title>
  <desc id="desc">Approved WP-UI-01 desktop mockup with fighter HUD at the top, a dominant arena, combat effects, compact replay controls, and telemetry closed by default.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2832"/>
      <stop offset="0.62" stop-color="#17414a"/>
      <stop offset="1" stop-color="#18272d"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24343a"/>
      <stop offset="1" stop-color="#0c151a"/>
    </linearGradient>
    <linearGradient id="hpA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#29d7e5"/>
      <stop offset="1" stop-color="#66e38f"/>
    </linearGradient>
    <linearGradient id="hpB" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ff8b3d"/>
      <stop offset="1" stop-color="#ffcf5a"/>
    </linearGradient>
    <radialGradient id="impact" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="0.22" stop-color="#ffd166" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#ff5d44" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#ff5d44" stop-opacity="0"/>
    </radialGradient>
    <pattern id="scan" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 12L12 0" stroke="#8de7e8" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000000" flood-opacity="0.52"/>
    </filter>
    <filter id="glowA" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowB" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="roundClip"><rect width="1600" height="900" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#roundClip)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="1600" height="900" fill="#071018"/>
    <rect x="24" y="24" width="1552" height="852" rx="22" fill="url(#sky)" stroke="#32545e" stroke-width="2"/>
    <rect x="24" y="24" width="1552" height="852" rx="22" fill="url(#scan)"/>

    <!-- Atmospheric arena -->
    <circle cx="800" cy="300" r="245" fill="#71d5d4" opacity="0.055"/>
    <path d="M24 388 C210 338 330 376 478 334 C642 288 764 362 924 316 C1124 258 1282 352 1576 278 L1576 520 L24 520 Z" fill="#081a20" opacity="0.68"/>
    <path d="M24 440 C182 390 316 452 472 402 C652 345 800 430 968 374 C1162 310 1348 408 1576 344 L1576 552 L24 552 Z" fill="#0b2025"/>
    <g fill="#132c31" opacity="0.95">
      <circle cx="95" cy="430" r="18"/><circle cx="137" cy="418" r="22"/><circle cx="184" cy="433" r="17"/>
      <circle cx="1240" cy="407" r="20"/><circle cx="1288" cy="424" r="17"/><circle cx="1340" cy="400" r="24"/>
      <circle cx="1430" cy="433" r="19"/><circle cx="1490" cy="414" r="25"/><circle cx="1536" cy="437" r="16"/>
    </g>

