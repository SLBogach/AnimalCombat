    <g filter="url(#shadow)">
      <path d="M1545 48 H988 L938 98 L988 129 H1545 Z" fill="#101c26" fill-opacity="0.96" stroke="#ff8b3d" stroke-width="2"/>
      <circle cx="1498" cy="88" r="31" fill="#3c281d" stroke="#ff8b3d" stroke-width="3"/>
      <path d="M1484 106 C1477 94 1479 81 1487 73 L1489 54 L1497 70 L1505 51 L1511 73 C1520 81 1522 95 1514 106 C1506 113 1492 113 1484 106 Z" fill="#ff8b3d" opacity="0.9"/>
      <circle cx="1493" cy="85" r="2.5" fill="#071018"/><circle cx="1507" cy="85" r="2.5" fill="#071018"/>
      <text x="1452" y="72" fill="#f4f7fa" font-size="25" font-weight="800" letter-spacing="1" text-anchor="end">KANGAROO</text>
