    <!-- Reference metadata -->
    <text x="800" y="891" fill="#65818a" font-size="9" font-weight="700" letter-spacing="2" text-anchor="middle">WP-UI-01 · GAME-FIRST DESKTOP REFERENCE · 16:9 · APPROVED 2026-09-08</text>
