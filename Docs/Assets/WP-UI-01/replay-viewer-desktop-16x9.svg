      <path d="M-60 94 C-88 122 -98 182 -78 235 L-104 314 L-51 318 L-20 256 L32 259 L58 318 L112 318 L88 232 C106 174 86 117 54 91 C26 69 -35 70 -60 94 Z" fill="#17262b" stroke="#29d7e5" stroke-width="7"/>
