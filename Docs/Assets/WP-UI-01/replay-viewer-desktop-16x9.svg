      <text x="1323" y="838" fill="#c7d3d9" font-size="14" font-weight="800" text-anchor="middle">DEBUG / TELEMETRY</text>
      <circle cx="1434" cy="832" r="5" fill="#66e38f"/>
      <text x="1450" y="837" fill="#9fb5bf" font-size="12" font-weight="700">READ ONLY</text>
