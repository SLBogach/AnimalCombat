      <circle r="112" fill="url(#impact)"/>
      <path d="M-74 -24 L-20 -10 L-53 25 L-5 18 L-27 67 L25 33 L42 80 L62 28 L104 56 L79 7 L119 -9 L69 -24 L92 -66 L43 -45 L27 -94 L5 -48 L-41 -79 L-27 -37 Z" fill="#ffd166" opacity="0.83"/>
    </g>
    <g filter="url(#shadow)">
      <text x="1118" y="294" fill="#ffd166" font-size="19" font-weight="900" letter-spacing="4">WALL IMPACT</text>
      <text x="1118" y="347" fill="#f4f7fa" font-size="54" font-weight="900">−93</text>
      <text x="1120" y="373" fill="#ffb078" font-size="15" font-weight="700">BLOCKED 930 · STAGGER +75</text>
    </g>

    <!-- Bottom broadcast controls -->
    <g filter="url(#shadow)">
      <path d="M24 790 H1576 V876 H24 Z" fill="#071018" fill-opacity="0.94"/>
      <path d="M24 790 H1576" stroke="#4d7078" stroke-width="2"/>
