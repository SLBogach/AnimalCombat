      <circle cx="44" cy="65" r="25" fill="#17262b" stroke="#29d7e5" stroke-width="6"/>
      <ellipse cx="2" cy="91" rx="69" ry="63" fill="#1d3035" stroke="#29d7e5" stroke-width="7"/>
      <ellipse cx="35" cy="103" rx="30" ry="22" fill="#29464b"/>
      <circle cx="36" cy="96" r="8" fill="#29d7e5"/>
      <path d="M52 151 C102 160 132 193 145 230" fill="none" stroke="#29d7e5" stroke-width="25" stroke-linecap="round"/>
      <path d="M-61 157 C-116 183 -133 214 -143 250" fill="none" stroke="#17262b" stroke-width="34" stroke-linecap="round"/>
      <path d="M-104 325 H-30 M54 325 H124" stroke="#29d7e5" stroke-width="9" stroke-linecap="round"/>
      <path d="M130 225 L159 234 L132 246" fill="#29d7e5"/>
