    <g filter="url(#shadow)">
      <path d="M55 48 H612 L662 98 L612 129 H55 Z" fill="#101c26" fill-opacity="0.96" stroke="#29d7e5" stroke-width="2"/>
      <circle cx="102" cy="88" r="31" fill="#14343a" stroke="#29d7e5" stroke-width="3"/>
      <path d="M83 102 C78 90 81 76 91 69 L89 60 L99 66 C105 63 112 63 118 66 L128 60 L126 71 C136 80 137 94 128 104 C117 113 94 113 83 102 Z" fill="#29d7e5" opacity="0.86"/>
