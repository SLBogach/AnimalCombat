      <text x="72" y="847" fill="#f4f7fa" font-size="14" font-weight="700">resolution-wall-grab-l1</text>
      <path d="M350 829 l9 9 l9 -9" fill="none" stroke="#a9b7c3" stroke-width="2"/>

      <rect x="574" y="805" width="452" height="57" rx="28.5" fill="#101c26" stroke="#5b7880"/>
      <circle cx="800" cy="833.5" r="23" fill="#29d7e5"/>
      <path d="M793 821 V846 M807 821 V846" stroke="#071018" stroke-width="5" stroke-linecap="round"/>
      <path d="M620 834 l14 -11 v22 z" fill="#a9b7c3" opacity="0.9"/>
      <text x="650" y="839" fill="#f4f7fa" font-size="14" font-weight="700">RESTART</text>
      <text x="880" y="839" fill="#a9b7c3" font-size="13" font-weight="700">SPEED</text>
      <rect x="937" y="817" width="70" height="33" rx="16.5" fill="#243640"/>
      <text x="972" y="839" fill="#f4f7fa" font-size="14" font-weight="800" text-anchor="middle">1.0×</text>

